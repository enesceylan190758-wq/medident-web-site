# Weekly blog + GEO → draft PR (no auto-deploy)
# Quality over daily thin-content spam. Director QC before merge.

name: Weekly content

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      blog:
        description: "Blog count"
        default: "3"
      geo:
        description: "GEO count"
        default: "1"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Generate weekly content skeleton
        run: |
          BLOG="${{ github.event.inputs.blog || '3' }}"
          GEO="${{ github.event.inputs.geo || '1' }}"
          node scripts/content/generate.mjs --blog "$BLOG" --geo "$GEO"

      - name: Build smoke (production paths)
        run: SITE_DOMAIN=https://medidentistanbul.com SITE_BASE= node build.mjs

      - name: Open draft PR (do not push to main / do not deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="cursor/weekly-seo-${DATE}-5c2b"
          git config user.name "medident-bot"
          git config user.email "bot@medidentistanbul.com"
          git checkout -b "$BRANCH"
          git add src/content || true
          if git diff --staged --quiet; then
            echo "No new content — skipping PR"
            exit 0
          fi
          git commit -m "chore: weekly blog+GEO draft ${DATE}"
          git push -u origin "$BRANCH"
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "Weekly SEO/GEO draft — ${DATE}" \
            --body "$(cat <<'EOF'
## Haftalık içerik taslağı

Otomatik iskelet üretim (`scripts/content/generate.mjs`).
**Canlıya alınmadı.** Merge öncesi:

- [ ] Director QC (`docs/medident-seo-geo-ajan-plani.md` §7)
- [ ] Şablon / thin GEO tekrarı yok
- [ ] Cevap ilk 2 cümlede
- [ ] Garanti / kesin sonuç yok
- [ ] İstenirse Cursor Automation ile metin güçlendirildi

Merge sonrası: `npm run deploy:domain` veya cloud agent deploy.

Kurulum notu: `directives/weekly_blog_geo.md` · Cursor: `directives/cursor-seo-geo-automation.md`
EOF
)"
