# Katman A — uretim. Haftalik icerik uretir ve PR ACAR. main'e YAZMAZ, DEPLOY ETMEZ.
# Deploy tek yerde: deploy.yml (main'e merge sonrasi).
#
# Akis: Pzt 06:00 UTC -> generate -> lint (yumusak) -> branch -> Draft PR
#       -> content-lint.yml PR'da sert kapiyi calistirir
#       -> hekim onayi -> merge -> deploy.yml

name: Weekly content (PR)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      blog:
        description: "Blog count"
        default: "3"
      geo:
        description: "GEO count"
        default: "1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Snapshot (once)
        run: cp -r src/content /tmp/content-before

      - name: Generate
        run: |
          BLOG="${{ github.event.inputs.blog || '3' }}"
          GEO="${{ github.event.inputs.geo || '1' }}"
          node scripts/content/generate.mjs --blog "$BLOG" --geo "$GEO"

      - name: On-lint (rapor — burada bloklamaz, PR'da bloklar)
        id: prelint
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/seo/lint-content.mjs --report-only --json lint-pre.json 2>&1 | tee prelint.txt

      - name: Build smoke
        run: SITE_DOMAIN=https://medidentistanbul.com SITE_BASE= node build.mjs

      - name: Branch + Draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WEEK="$(date -u +%G-w%V)"
          BR="content/${WEEK}"
          git config user.name  "medident-bot"
          git config user.email "bot@medidentistanbul.com"

          git checkout -b "$BR"
          git add src/content
          if git diff --staged --quiet; then
            echo "Degisiklik yok, PR acilmadi."
            exit 0
          fi
          git commit -m "content: haftalik blog+GEO ${WEEK}"
          git push -u origin "$BR" --force-with-lease

          BODY=$(cat <<'EOF'
          Otomatik haftalik icerik taslagi. **Bu PR merge edilmeden canliya cikmaz.**

          ### Onay adimlari
          - [ ] Content gate PASS
          - [ ] Hekim tibbi onayi (rakam / sure / endikasyon satirlari)
          - [ ] TR yasal kontrol (garanti, fiyat, hasta yorumu, oncesi-sonrasi yok)
          - [ ] author / reviewer / reviewedAt dolduruldu

          Lint raporu asagida; RED kalirsa merge edilemez.
          EOF
          )
          gh pr create --draft --base main --head "$BR" \
            --title "content: haftalik blog+GEO ${WEEK}" \
            --body "$BODY" \
            --label "content,automated" || echo "PR zaten acik olabilir"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prelint
          path: |
            prelint.txt
            lint-pre.json
