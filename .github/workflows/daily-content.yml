# Monthly backup content → draft PR (prefer weekly-content.yml)
# Was daily; reduced to avoid thin-content spam (SEO/GEO research plan).

name: Monthly content backup

on:
  schedule:
    # 1st of month 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      blog:
        description: "Blog count"
        default: "2"
      geo:
        description: "GEO count"
        default: "1"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Generate content skeleton
        run: |
          BLOG="${{ github.event.inputs.blog || '2' }}"
          GEO="${{ github.event.inputs.geo || '1' }}"
          node scripts/content/generate.mjs --blog "$BLOG" --geo "$GEO"

      - name: Build smoke
        run: SITE_DOMAIN=https://medidentistanbul.com SITE_BASE= node build.mjs

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="cursor/monthly-seo-${DATE}-5c2b"
          git config user.name "medident-bot"
          git config user.email "bot@medidentistanbul.com"
          git checkout -b "$BRANCH"
          git add src/content || true
          if git diff --staged --quiet; then
            echo "No new content — skipping PR"
            exit 0
          fi
          git commit -m "chore: monthly blog+GEO draft ${DATE}"
          git push -u origin "$BRANCH"
          BODY_FILE=$(mktemp)
          printf '%s\n' \
            "Aylik yedek iskelet. Tercih edilen akis: Weekly content + Cursor Automation." \
            "Canliya alma yok — QC sonra merge." \
            > "$BODY_FILE"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Monthly SEO/GEO backup draft — ${DATE}" \
            --body-file "$BODY_FILE"
