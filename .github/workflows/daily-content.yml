# Monthly backup content → commit main → deploy gh-pages
# Prefer weekly-content.yml; this is a light monthly safety net.

name: Monthly content backup

on:
  schedule:
    # 1st of month 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      blog:
        description: "Blog count"
        default: "2"
      geo:
        description: "GEO count"
        default: "1"

permissions:
  contents: write
  pages: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Generate content
        run: |
          BLOG="${{ github.event.inputs.blog || '2' }}"
          GEO="${{ github.event.inputs.geo || '1' }}"
          node scripts/content/generate.mjs --blog "$BLOG" --geo "$GEO"

      - name: Build production
        run: SITE_DOMAIN=https://medidentistanbul.com SITE_BASE= node build.mjs

      - name: Commit content sources to main
        run: |
          set -e
          git config user.name "medident-bot"
          git config user.email "bot@medidentistanbul.com"
          git add src/content || true
          if git diff --staged --quiet; then
            echo "No content source changes"
          else
            git commit -m "chore: monthly blog+GEO content $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Deploy gh-pages (live)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUSTOM_DOMAIN=medidentistanbul.com \
          SITE_DOMAIN=https://medidentistanbul.com \
          SITE_BASE= \
          node scripts/deploy-pages.mjs
