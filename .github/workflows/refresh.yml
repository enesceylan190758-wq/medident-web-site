# Katman A — tazelik. Cuma sabahi decay taramasi -> Issue acar.
# Yeni sayfa URETMEZ. Deploy ETMEZ.

name: Refresh scan

on:
  schedule:
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Decay taramasi
        run: node scripts/seo/decay-scan.mjs --days 90 --top 12

      - name: Korpus saglik raporu
        run: node scripts/seo/lint-content.mjs --report-only --json lint-all.json > lint-all.txt || true

      - name: Issue ac
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const decay = fs.readFileSync('decay-report.md','utf8');
            const all = JSON.parse(fs.readFileSync('lint-all.json','utf8'));
            const top = Object.entries(all.byRule).sort((a,b)=>b[1]-a[1])
              .map(([k,v])=>`- \`${k}\`: ${v}`).join('\n');
            const body = [
              decay, '', '---', '',
              `## Korpus sagligi`, '',
              `**${all.red} RED**, ${all.warn} WARN / ${all.scanned} sayfa`, '',
              top, '',
              '> Refresh PR kurali: ayni URL, `updatedAt` tazele, yeni URL acma.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Tazelik + korpus raporu — ${new Date().toISOString().slice(0,10)}`,
              body,
              labels: ['seo','refresh']
            });
