<title>MediDent Reklam Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: kontrol satiri -> 4 ozet kutusu -> iki gunluk grafik -> bulgular -> kampanya ve hesap tablolari; tek kolon, 1180px */
:root {
  --bg: #f6f7f8;
  --surface: #ffffff;
  --fg: #12171c;
  --fg-2: #4b5560;
  --fg-3: #7a858f;
  --line: #e2e6ea;
  --line-strong: #c9d0d6;
  --accent: #0f6b78;
  --accent-soft: #e3f1f2;
  --s1: #2a78d6;
  --s3: #158f64;
  --good: #0a7d0a;
  --warn: #9a6700;
  --warn-bg: #fff4d6;
  --serious: #b3471f;
  --serious-bg: #fde9e0;
  --crit: #c02f2f;
  --crit-bg: #fde4e4;
  --info: #0f6b78;
  --info-bg: #e3f1f2;
  --low: #4b5560;
  --low-bg: #edf0f2;
  --display: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111416; --surface: #181c1f; --fg: #eef1f3; --fg-2: #b5bec6; --fg-3: #87929b;
    --line: #262c31; --line-strong: #353d43; --accent: #4fb3bf; --accent-soft: #15302f;
    --s1: #3987e5; --s3: #1fae7c; --good: #3cc23c;
    --warn: #f1b73a; --warn-bg: #2f2610; --serious: #f08c63; --serious-bg: #33190f;
    --crit: #f07070; --crit-bg: #361515; --info: #4fb3bf; --info-bg: #15302f; --low: #b5bec6; --low-bg: #22282c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111416; --surface: #181c1f; --fg: #eef1f3; --fg-2: #b5bec6; --fg-3: #87929b;
  --line: #262c31; --line-strong: #353d43; --accent: #4fb3bf; --accent-soft: #15302f;
  --s1: #3987e5; --s3: #1fae7c; --good: #3cc23c;
  --warn: #f1b73a; --warn-bg: #2f2610; --serious: #f08c63; --serious-bg: #33190f;
  --crit: #f07070; --crit-bg: #361515; --info: #4fb3bf; --info-bg: #15302f; --low: #b5bec6; --low-bg: #22282c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 20px; }
h1 { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
.num, td.n, .kpi .v { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-3); }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
header .sub { color: var(--fg-2); margin-top: 4px; font-size: 13px; }
.note { background: var(--accent-soft); color: var(--fg); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
.note b { font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .cur { font-family: var(--mono); font-size: 11px; opacity: .7; }
.chip:focus-visible, select:focus-visible, input:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-2); }
select, input[type="date"] { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .05em; }
.kpi .v { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .d { font-size: 12px; color: var(--fg-3); }
.d .up-bad, .d .down-bad { color: var(--crit); }
.d .up-good, .d .down-good { color: var(--good); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart { position: relative; height: 170px; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { fill: var(--fg-3); font-family: var(--mono); font-size: 10px; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; }
.tip b { font-family: var(--mono); font-weight: 500; }

.findings { list-style: none; margin: 0; padding: 0; display: grid; }
.finding { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.finding:first-child { border-top: 0; padding-top: 2px; }
.sev { align-self: start; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; justify-self: start; white-space: nowrap; }
.sev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sev.high { color: var(--crit); background: var(--crit-bg); }
.sev.medium { color: var(--serious); background: var(--serious-bg); }
.sev.low { color: var(--low); background: var(--low-bg); }
.sev.info { color: var(--info); background: var(--info-bg); }
.finding .t { font-weight: 600; overflow-wrap: anywhere; }
.finding .m { color: var(--fg-2); }
.finding .ctx { font-size: 12px; color: var(--fg-3); overflow-wrap: anywhere; }
.finding .body { display: grid; gap: 2px; min-width: 0; }
.empty { color: var(--fg-3); padding: 8px 0; }

.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--fg-2); white-space: nowrap; }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
th.n, td.n { text-align: right; white-space: nowrap; }
td.name { min-width: 220px; }
.obj { font-size: 12px; color: var(--fg-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.status { font-size: 12px; white-space: nowrap; }
.status.ok { color: var(--good); }
.status.bad { color: var(--crit); }

footer { font-size: 12px; color: var(--fg-3); }

@media (max-width: 860px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .charts { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .wrap { padding-inline: 16px; }
  .kpi .v { font-size: 20px; }
  .finding { grid-template-columns: minmax(0, 1fr); }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>MediDent Reklam Paneli</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="controls">
      <label class="field" for="end">Dönem sonu <input type="date" id="end"></label>
      <label class="field" for="win">Süre
        <select id="win">
          <option value="7">7 gün</option>
          <option value="30" selected>30 gün</option>
          <option value="60">60 gün</option>
          <option value="90">90 gün</option>
        </select>
      </label>
    </div>
  </header>

  <div class="chips" id="accounts" role="group" aria-label="Reklam hesabı"></div>

  <div class="note" id="note"></div>

  <section class="kpis" id="kpis" aria-label="Özet"></section>

  <section class="charts">
    <div class="panel">
      <div class="panel-head"><h2>Günlük harcama</h2><span class="muted" id="spendCur"></span></div>
      <div class="chart" id="chSpend"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Günlük sonuç</h2><span class="muted">form + WhatsApp konuşması</span></div>
      <div class="chart" id="chRes"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Öneriler</h2><span class="muted" id="findCount"></span></div>
    <ul class="findings" id="findings"></ul>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Kampanyalar</h2><span class="muted">sonuç başı maliyet yalnız form ve mesaj kampanyalarında</span></div>
    <div class="tablebox"><table id="camps"></table></div>
  </section>

  <section class="panel" id="accPanel">
    <div class="panel-head"><h2>Hesaplar</h2></div>
    <div class="tablebox"><table id="accs"></table></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
const DATA = /*__DATA__*/null;

const OBJ = {
  OUTCOME_LEADS: "Form", LEAD_GENERATION: "Form", MESSAGES: "Mesaj", OUTCOME_ENGAGEMENT: "Etkileşim",
  OUTCOME_AWARENESS: "Bilinirlik", OUTCOME_TRAFFIC: "Trafik", OUTCOME_SALES: "Satış", LINK_CLICKS: "Tıklama",
};
const SEV = { high: "Acil", medium: "Dikkat", low: "Düşük", info: "Fırsat" };
const ACC_STATUS = { 1: "Aktif", 2: "Devre dışı", 3: "Ödenmemiş", 7: "İncelemede", 9: "Ek süre", 100: "Kapanıyor", 101: "Kapalı" };
const MSG = "onsite_conversion.messaging_conversation_started_7d";

const DAY = 864e5;
const addD = (s, n) => new Date(Date.parse(s) + n * DAY).toISOString().slice(0, 10);
const nf0 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 1 });
const money = (n, cur) => n == null ? "–" : `${nf0.format(n)} ${cur === "TRY" ? "₺" : cur || ""}`.trim();
const pctf = (x, d = 2) => x == null ? "–" : `%${(x * 100).toFixed(d).replace(".", ",")}`;
const dateTR = (s) => new Date(s + "T00:00:00Z").toLocaleDateString("tr-TR", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Ham satirlari kural motorunun bekledigi bicime cevir (sayfada bir kez)
const ROWS = DATA.rows.map(([date, ai, spend, imp, freq, clicks, leads, msgs]) => {
  const [ad_id, ad_name, adset_id, ci] = DATA.ads[ai];
  const [campaign_id, campaign_name, objective, optimization_goal, acci] = DATA.campaigns[ci];
  const a = DATA.accounts[acci];
  const actions = [];
  if (leads) actions.push({ action_type: "lead", value: String(leads) });
  if (msgs) actions.push({ action_type: MSG, value: String(msgs) });
  return {
    date_start: date, account_id: a.id.replace("act_", ""), account_name: a.name, account_currency: a.currency, acci,
    campaign_id, campaign_name, objective, optimization_goal, adset_id, ad_id, ad_name,
    spend: String(spend), impressions: String(imp), frequency: String(freq), inline_link_clicks: String(clicks), actions,
    _spend: spend, _imp: imp, _clicks: clicks, _res: leads + msgs, _leads: leads, _msgs: msgs,
  };
});

// Varsayilan donem sonu: verideki son harcama gunu
const lastSpendDay = ROWS.reduce((m, r) => (r._spend > 0 && r.date_start > m ? r.date_start : m), DATA.since);

const store = {
  get(k) { try { return localStorage.getItem("adsPanel:" + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("adsPanel:" + k, v); } catch {} },
};
const state = {
  account: store.get("account") || "all",
  end: lastSpendDay,
  win: Number(store.get("win") || 30),
  sort: { key: "spend", dir: -1 },
};
if (state.account !== "all" && !DATA.accounts.some((a) => a.id === state.account)) state.account = "all";

const $ = (id) => document.getElementById(id);

function setup() {
  $("sub").textContent = `${DATA.accounts.length} reklam hesabı · Meta Marketing API`;
  const endEl = $("end");
  endEl.min = addD(DATA.since, 6);
  endEl.max = DATA.until;
  endEl.value = state.end;
  endEl.addEventListener("change", () => { if (endEl.value) { state.end = endEl.value; render(); } });
  $("win").value = String(state.win);
  $("win").addEventListener("change", (e) => { state.win = Number(e.target.value); store.set("win", e.target.value); render(); });

  const chips = [{ id: "all", name: "Tüm hesaplar" }, ...DATA.accounts];
  $("accounts").innerHTML = chips.map((a) =>
    `<button class="chip" type="button" id="acc-${esc(a.id)}" data-id="${esc(a.id)}">${esc(a.name)}${a.currency ? ` <span class="cur">${esc(a.currency)}</span>` : ""}</button>`
  ).join("");
  $("accounts").addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (!b) return;
    state.account = b.dataset.id;
    store.set("account", state.account);
    render();
  });

  $("note").innerHTML = `<b>Bu sayfa bir prototip.</b> Veri ${dateTR(DATA.since)} – ${dateTR(DATA.until)} arası, ` +
    `${dateTR(DATA.generatedAt.slice(0, 10))} tarihinde sunucu tarafında çekildi; Meta jetonu sayfada yok. ` +
    `Son harcama ${dateTR(lastSpendDay)}, dönem sonu oraya ayarlı. Tarihi değiştirerek geçmiş haftaların önerilerini görebilirsin.`;
  $("foot").textContent = `Öneriler otomatik kurallardan gelir; hiçbir reklam durdurulmaz ya da bütçesi değiştirilmez. Veri: ${DATA.generatedAt.slice(0, 16).replace("T", " ")} UTC.`;
}

function agg(rows) {
  const a = { spend: 0, imp: 0, clicks: 0, res: 0, leads: 0, msgs: 0, mSpend: 0, mRes: 0 };
  for (const r of rows) {
    a.spend += r._spend; a.imp += r._imp; a.clicks += r._clicks; a.res += r._res; a.leads += r._leads; a.msgs += r._msgs;
    if (measuresResults(r)) { a.mSpend += r._spend; a.mRes += r._res; }
  }
  a.cpl = a.mRes ? a.mSpend / a.mRes : null;
  a.ctr = a.imp ? a.clicks / a.imp : null;
  return a;
}

function render() {
  const from = addD(state.end, -(state.win - 1));
  const pFrom = addD(from, -state.win), pTo = addD(from, -1);
  const inAcc = (r) => state.account === "all" || DATA.accounts[r.acci].id === state.account;
  const cur = ROWS.filter((r) => inAcc(r) && r.date_start >= from && r.date_start <= state.end);
  const prev = ROWS.filter((r) => inAcc(r) && r.date_start >= pFrom && r.date_start <= pTo);

  document.querySelectorAll("#accounts .chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === state.account)));
  const selAccs = state.account === "all" ? DATA.accounts : DATA.accounts.filter((a) => a.id === state.account);
  const currencies = [...new Set(selAccs.map((a) => a.currency))];
  const mixed = currencies.length > 1;
  const curr = mixed ? null : currencies[0];

  // KPI
  const A = agg(cur), P = agg(prev);
  const delta = (a, b, goodWhenUp) => {
    if (b == null || a == null || !prev.length) return `<span>önceki ${state.win} günde veri yok</span>`;
    if (b === 0) return a === 0 ? "önceki döneme göre değişmedi" : "önceki dönemde 0";
    const d = a / b - 1;
    if (Math.abs(d) < 0.005) return `önceki ${state.win} güne göre değişmedi`;
    const up = d > 0;
    const cls = up ? (goodWhenUp ? "up-good" : "up-bad") : (goodWhenUp ? "down-bad" : "down-good");
    return `<span class="${cls}">${up ? "▲" : "▼"} %${nf0.format(Math.abs(d * 100))}</span> önceki ${state.win} güne göre`;
  };
  const kpis = [
    ["Harcama", mixed ? "Para birimi karışık" : money(A.spend, curr), mixed ? "Toplam için tek hesap seç" : delta(A.spend, P.spend, null)],
    ["Sonuç", nf0.format(A.res), `${nf0.format(A.leads)} form · ${nf0.format(A.msgs)} mesaj · ${delta(A.res, P.res, true)}`],
    ["Sonuç başı maliyet", mixed ? "–" : money(A.cpl, curr), mixed ? "Tek hesap seç" : delta(A.cpl, P.cpl, false)],
    ["Link tıklama oranı", pctf(A.ctr), delta(A.ctr, P.ctr, true)],
  ];
  $("kpis").innerHTML = kpis.map(([l, v, d]) =>
    `<div class="kpi"><div class="l">${l}</div><div class="v" title="${esc(String(v))}">${v}</div><div class="d">${d}</div></div>`).join("");
  // Harcama deltasi: artis ne iyi ne kotu, notr renk
  $("kpis").querySelectorAll(".kpi:first-child .d span").forEach((s) => (s.className = ""));

  // Gunluk seriler
  const days = Array.from({ length: state.win }, (_, i) => addD(from, i));
  const byDay = new Map(days.map((d) => [d, { spend: 0, res: 0 }]));
  for (const r of cur) { const o = byDay.get(r.date_start); if (o) { o.spend += r._spend; o.res += r._res; } }
  $("spendCur").textContent = mixed ? "karışık para birimi" : curr === "TRY" ? "₺" : curr;
  barChart($("chSpend"), days, days.map((d) => byDay.get(d).spend), "var(--s1)", (v) => mixed ? nf0.format(v) : money(v, curr));
  barChart($("chRes"), days, days.map((d) => byDay.get(d).res), "var(--s3)", (v) => `${nf0.format(v)} sonuç`);

  // Oneriler: ayni kural motoru, secili donem ve hesaplar
  const adSetsNone = [];
  const report = analyze(cur, { until: state.end, adSets: adSetsNone });
  const fs = report.findings;
  $("findCount").textContent = `${dateTR(addD(state.end, -6))} – ${dateTR(state.end)} haftasına göre · ${fs.length} öneri`;
  $("findings").innerHTML = fs.length ? fs.map((f) => `
    <li class="finding">
      <span class="sev ${f.severity}">${SEV[f.severity]}</span>
      <div class="body">
        <div class="t">${esc(f.name)}</div>
        <div class="m">${esc(f.message)}</div>
        <div class="ctx">${esc([f.campaign, state.account === "all" ? f.account_name : null].filter(Boolean).join(" · "))}</div>
      </div>
    </li>`).join("") : `<li class="empty">Bu dönemde öneri yok.</li>`;

  // Kampanya tablosu
  const camps = new Map();
  for (const r of cur) {
    if (!camps.has(r.campaign_id)) camps.set(r.campaign_id, { name: r.campaign_name, obj: r.objective, acc: r.account_name, currency: r.account_currency, rows: [] });
    camps.get(r.campaign_id).rows.push(r);
  }
  const list = [...camps.values()].map((c) => {
    const a = agg(c.rows);
    return { ...c, spend: a.spend, res: a.res, cpl: a.mRes ? a.mSpend / a.mRes : null, ctr: a.ctr, imp: a.imp };
  });
  const { key, dir } = state.sort;
  list.sort((x, y) => ((x[key] ?? Infinity) > (y[key] ?? Infinity) ? 1 : (x[key] ?? Infinity) < (y[key] ?? Infinity) ? -1 : 0) * dir);
  const th = (k, label, n) => `<th class="${n ? "n" : ""}" aria-sort="${key === k ? (dir > 0 ? "ascending" : "descending") : "none"}"><button type="button" data-k="${k}">${label}${key === k ? (dir > 0 ? " ↑" : " ↓") : ""}</button></th>`;
  $("camps").innerHTML = `<thead><tr>${th("name", "Kampanya")}${th("obj", "Amaç")}${th("spend", "Harcama", 1)}${th("res", "Sonuç", 1)}${th("cpl", "Sonuç başı", 1)}${th("ctr", "Link CTR", 1)}</tr></thead><tbody>` +
    (list.length ? list.map((c) => `<tr>
      <td class="name">${esc(c.name)}${state.account === "all" ? `<div class="muted" style="font-size:12px">${esc(c.acc)}</div>` : ""}</td>
      <td class="obj">${esc(OBJ[c.obj] || c.obj || "–")}</td>
      <td class="n">${money(c.spend, c.currency)}</td>
      <td class="n">${nf0.format(c.res)}</td>
      <td class="n">${money(c.cpl, c.currency)}</td>
      <td class="n">${pctf(c.ctr)}</td></tr>`).join("") : `<tr><td colspan="6" class="empty">Bu dönemde harcama yapan kampanya yok.</td></tr>`) + "</tbody>";

  // Hesap tablosu (yalniz "tum hesaplar"da)
  $("accPanel").hidden = state.account !== "all";
  if (state.account === "all") {
    $("accs").innerHTML = `<thead><tr><th>Hesap</th><th>Durum</th><th class="n">Harcama</th><th class="n">Sonuç</th><th class="n">Sonuç başı</th><th class="n">Son harcama</th></tr></thead><tbody>` +
      DATA.accounts.map((acc, i) => {
        const rs = cur.filter((r) => r.acci === i);
        const a = agg(rs);
        const last = ROWS.reduce((m, r) => (r.acci === i && r._spend > 0 && r.date_start <= state.end && r.date_start > m ? r.date_start : m), "");
        return `<tr><td class="name">${esc(acc.name)}<div class="muted" style="font-size:12px">${esc(acc.id)}</div></td>
          <td class="status ${acc.status === 1 ? "ok" : "bad"}">${esc(ACC_STATUS[acc.status] || acc.status)}</td>
          <td class="n">${money(a.spend, acc.currency)}</td><td class="n">${nf0.format(a.res)}</td>
          <td class="n">${money(a.cpl, acc.currency)}</td><td class="n">${last ? dateTR(last) : "–"}</td></tr>`;
      }).join("") + "</tbody>";
  }
}

$("camps").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  const k = b.dataset.k;
  state.sort = state.sort.key === k ? { key: k, dir: -state.sort.dir } : { key: k, dir: k === "name" || k === "obj" ? 1 : -1 };
  render();
});

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function barChart(el, days, vals, color, fmt) {
  const W = Math.max(280, el.clientWidth), H = el.clientHeight || 170;
  const padL = 44, padR = 4, padT = 8, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = niceMax(Math.max(...vals));
  const y = (v) => padT + ih - (v / max) * ih;
  const step = iw / days.length;
  const bw = Math.max(1, Math.min(18, step - 2));
  const ticks = [0, max / 2, max];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(el.previousElementSibling?.querySelector("h2")?.textContent || "")}">`;
  for (const t of ticks) {
    s += `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${padL - 6}" y="${y(t) + 3}" text-anchor="end">${nf0.format(t)}</text>`;
  }
  vals.forEach((v, i) => {
    if (!v) return;
    const x = padL + i * step + (step - bw) / 2, h = Math.max(1, ih - (y(v) - padT));
    const r = Math.min(2, bw / 2, h);
    s += `<path d="M${x},${padT + ih} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${color}"/>`;
  });
  // x etiketleri: ilk, orta, son
  const labIdx = days.length > 2 ? [0, Math.floor((days.length - 1) / 2), days.length - 1] : days.map((_, i) => i);
  for (const i of labIdx) {
    const d = new Date(days[i] + "T00:00:00Z").toLocaleDateString("tr-TR", { day: "numeric", month: "short", timeZone: "UTC" });
    const anchor = i === 0 ? "start" : i === days.length - 1 ? "end" : "middle";
    const x = i === 0 ? padL : i === days.length - 1 ? W - padR : padL + i * step + step / 2;
    s += `<text x="${x}" y="${H - 6}" text-anchor="${anchor}">${d}</text>`;
  }
  s += `<line x1="${padL}" x2="${W - padR}" y1="${padT + ih}" y2="${padT + ih}" stroke="var(--line-strong)" stroke-width="1"/>`;
  s += `<rect class="hit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/>`;
  s += `</svg><div class="tip" hidden></div>`;
  el.innerHTML = s;
  const tip = el.querySelector(".tip"), svg = el.querySelector("svg");
  const move = (e) => {
    const rect = svg.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const i = Math.floor((px - padL) / step);
    if (i < 0 || i >= days.length) { tip.hidden = true; return; }
    const v = vals[i];
    tip.innerHTML = `${dateTR(days[i])}<br><b>${fmt(v)}</b>`;
    tip.style.left = `${((padL + i * step + step / 2) / W) * 100}%`;
    tip.style.top = `${(y(v) / H) * 100}%`;
    tip.hidden = false;
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", () => (tip.hidden = true));
}

setup();
render();
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });
</script>
